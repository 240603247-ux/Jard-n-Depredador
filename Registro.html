<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Café & Aroma - Registro</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <h1>Únete a nuestra comunidad de plantas carnívoras</h1>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="contenido.html">Contenido</a>
        <a href="registro.html">Registro</a>
        <a href="intereses.html">Intereses</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <main>
        <h2>Regístrate para conocer más sobre las Venus atrapamoscas y otras plantas carnívoras.</h2>

        <form action="#" method="post">

            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>

            <label for="Select">¿Qué te interesa conocer?:</label>
            <input type="Select" id="Select" name="Select" required>
            <select id="opciones" name="opciones">
               <option value="1">Venus atrapamoscas</option>
               <option value="2">Plantas carnívoras</option>
               <option value="3">Cuidado de plantas</option>
               <option value="3">Curiosidades sobre plantas</option>
            </select>

            <button type="submit">Registrarse</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Café & Aroma</p>
    </footer>

</body>
</html>
